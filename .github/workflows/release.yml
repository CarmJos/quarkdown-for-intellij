# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# On release publication: builds the plugin and uploads the distribution to the release assets.
# Only full releases (non-prereleases) are published to the JetBrains Marketplace;
# prereleases are uploaded to the release assets without being published to the Marketplace.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release

on:
  release:
    types: [ published ]

jobs:

  # Build the plugin, upload it to the release and (for full releases) publish to JetBrains Marketplace
  release:
    name: Release Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Compute artifact name: <repo>_<version>_<short-commit-sha>
      # Version is read from gradle.properties (same as the build workflow).
      - name: Compute artifact name
        id: artifact
        run: |
          VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          SHA=$(git rev-parse --short HEAD)
          echo "name=${GITHUB_REPOSITORY##*/}_${VERSION}_${SHA}" >> "$GITHUB_OUTPUT"

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note (full releases only)
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' && !github.event.release.prerelease }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # Build the plugin distribution
      - name: Build Plugin
        run: ./gradlew buildPlugin

      # Upload the plugin distribution as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*.zip --clobber

      # Also store the plugin as an Actions artifact (named with version + commit).
      # The release asset above is left untouched; the distribution zip is simply
      # unpacked so the artifact is the plugin itself (directly installable).
      - name: Unpack plugin distribution
        run: |
          mkdir -p ./build/artifact
          cd ./build/artifact
          unzip -q ../distributions/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ./build/artifact/
          if-no-files-found: error

      # Publish the plugin to JetBrains Marketplace (full releases only, not prereleases)
      - name: Publish Plugin
        if: ${{ !github.event.release.prerelease }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Create a pull request (full releases only)
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' && !github.event.release.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          # Keep [ci skip] in the commit body (second line) so the title stays clean
          git commit -am "docs: Changelog update - $VERSION" -m "[ci skip]"

          # Force-push so re-runs overwrite a branch left over from a previous run
          git push --force --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          # Reuse an existing PR for this branch (workflow re-runs), otherwise create one
          if ! gh pr view --head "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --title "docs: Changelog update - \`$VERSION\`" \
              --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
              --label "$LABEL" \
              --head $BRANCH
          fi
