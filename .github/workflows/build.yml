# GitHub Actions Workflow created for handling the build process.
# Builds the plugin, runs tests and verifies the plugin structure on every commit/PR.
# Can also be triggered manually from the Actions tab (workflow_dispatch).

name: Build

on:
  # Trigger the workflow on pushes to the default 'master' branch
  # (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ master ]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Compute artifact name: <repo>_<version>_<short-commit-sha>
      - name: Compute artifact name
        id: artifact
        run: |
          VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          SHA=$(git rev-parse --short HEAD)
          echo "name=${GITHUB_REPOSITORY##*/}_${VERSION}_${SHA}" >> "$GITHUB_OUTPUT"

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Store an already-built plugin as an artifact for downloading
      # Artifact is named after the repository name.
      # upload-artifact always wraps its content in a zip, so uploading the
      # distribution zip would produce a zip inside a zip. Unpacking it first
      # makes the downloaded artifact the plugin itself (directly installable).
      - name: Unpack plugin distribution
        run: |
          cd ./build/distributions
          unzip -q *.zip
          rm *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ./build/distributions/
          if-no-files-found: error

  # Run tests and upload test reports on failure.
  # The plugin contains platform-specific logic (Windows .bat/.cmd launchers, macOS
  # Homebrew paths, `taskkill` for process termination), so tests run on all three OSes.
  test:
    name: Test (${{ matrix.os }})
    needs: [ build ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run tests
      - name: Run Tests
        shell: bash
        run: ./gradlew check

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result-${{ matrix.os }}
          path: ${{ github.workspace }}/build/reports/tests

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
