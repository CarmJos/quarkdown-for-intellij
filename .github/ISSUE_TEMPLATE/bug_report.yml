name: Bug report
description: Report a bug or unexpected behavior in the Quarkdown for IntelliJ plugin
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please describe the problem below. The environment details
        are required — the IDE, plugin, Quarkdown and system versions are the first thing we
        need to reproduce the issue. Feel free to leave optional extras blank.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues and this has not been reported yet.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead. Include error messages, screenshots, or the `.qd` source that triggers the bug if possible.
      placeholder: |
        - What I did: ...
        - What went wrong: ...
        - What I expected: ...
    validations:
      required: true

  - type: input
    id: idea-version
    attributes:
      label: IntelliJ IDEA version
      description: Exact IDE version from **Help ▸ About**, e.g. `2026.2.2` (`IU-262.10315.69`).
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Version of the Quarkdown plugin as shown in **Settings ▸ Plugins**, e.g. `1.2.3`.
    validations:
      required: true

  - type: input
    id: quarkdown-version
    attributes:
      label: Quarkdown version
      description: Version of the Quarkdown CLI / SDK you use, e.g. `1.0.0` (see plugin Settings or `quarkdown --version`).
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system
      description: e.g. `Windows 11 24H2` / `macOS 15.5` / `Ubuntu 24.04` — include architecture (x64 / arm64) if relevant.
    validations:
      required: true

  - type: textarea
    id: extra-info
    attributes:
      label: Extra information
      description: Anything else that may help — logs, screenshots, Quarkdown home path, JCEF availability, headless environment, etc.
      placeholder: |
        - Quarkdown home: ...
        - Repro steps with minimal `.qd` source: ...
        - Relevant log snippets or stack traces: ...
        - Anything else: ...