name: Bug report
description: Report a bug or unexpected behavior in the Quarkdown for IntelliJ plugin
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Just describe the problem below — tell us whatever you know,
        no need to fill in every detail.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues and this has not been reported yet.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead. Include error messages, screenshots, or the `.qd` source that triggers the bug if possible.
      placeholder: |
        - What I did: ...
        - What went wrong: ...
        - What I expected: ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Fill in whatever you know — this helps us reproduce the issue faster.
      placeholder: |
        - IntelliJ IDEA version: e.g. 2025.2
        - Plugin version: e.g. 0.1.0
        - Quarkdown version: e.g. 0.1.0
        - Operating system: e.g. Windows 11 / macOS 15 / Ubuntu 24.04