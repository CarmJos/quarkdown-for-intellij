name: Feature request
description: Suggest an idea for the Quarkdown for IntelliJ plugin
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Tell us what you'd like and why —
        a few sentences is enough, but the more detail the better.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues and this has not been requested yet.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Describe the feature, the problem it solves, and roughly how you imagine it working.
      placeholder: |
        - The problem: ...
        - The proposed feature: ...
        - How it might work: ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Screenshots, examples, alternatives you've tried, or environment info — anything else that helps.